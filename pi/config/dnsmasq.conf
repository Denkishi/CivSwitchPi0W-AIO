# CivSwitch Pi Zero W — dnsmasq configuration
# DHCP on wlan0 for the Switch
interface=wlan0
bind-interfaces
# DHCP range (avoid .1 which is the Pi)
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,24h
# Redirect all DNS to the Pi (captive portal for Nintendo checks)
address=/#/192.168.4.1
# Don't read /etc/resolv.conf
no-resolv
# Don't read /etc/hosts
no-hosts
# Log DHCP leases
log-dhcp
