name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Compile + supervisor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --upgrade pip pyserial
      - name: Byte-compile every module
        run: python -m compileall -q pc pi tests
      - name: Supervisor logic tests
        run: python tests/test_supervisor.py

  build-exe:
    name: Build Windows .exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --upgrade pip "pyinstaller>=6.11" pyserial pillow
      - name: Build CivSwitch.exe
        run: python -m PyInstaller pc/civswitch.spec --noconfirm --distpath dist --workpath build/pyi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CivSwitch-exe
          path: dist/CivSwitch.exe
          if-no-files-found: error
